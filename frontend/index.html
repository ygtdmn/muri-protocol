<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- Title, description, canonical, Open Graph and X tags: filled per page from src/lib/seo.ts. -->
		<!--page-meta-->
		<meta name="author" content="Yigit Duman" />
		<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icon/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/icon/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-icon-180x180.png" />
		<link rel="manifest" href="/site.webmanifest" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
		/>

		<!-- Apply the saved theme before first paint to avoid a flash. -->
		<script>
			(function () {
				try {
					var v = localStorage.getItem("muri-theme");
					var dark =
						v === "dark" ||
						(v !== "light" &&
							!window.matchMedia("(prefers-color-scheme: light)").matches);
					document.documentElement.classList.toggle("dark", dark);
				} catch (e) {
					document.documentElement.classList.add("dark");
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
