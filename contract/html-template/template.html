      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #000;
        font-family: Arial, sans-serif;
      }

      #content {
        color: white;
      }

      #debug {
        position: fixed;
        top: 10px;
        left: 10px;
        color: white;
        font-family: monospace;
        font-size: 12px;
        max-width: 300px;
        word-break: break-all;
        z-index: 1000;
      }

      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #000;
        touch-action: none;
        cursor: grab;
      }

      .stage.grabbing {
        cursor: grabbing;
      }

      .panzoom {
        transform-origin: 0 0;
        visibility: hidden;
      }

      .panzoom img {
        display: block;
        user-select: none;
        -webkit-user-drag: none;
        -khtml-user-drag: none;
        -moz-user-drag: none;
        -o-user-drag: none;
        user-drag: none;
      }

      /* Media Players */
      .media-container {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
        overflow: auto;
      }

      .video-player,
      .audio-player {
        max-width: 90vw;
        max-height: 90vh;
      }

      .audio-player {
        width: 400px;
      }

      /* 3D Viewer */
      .threejs-container {
        position: fixed;
        inset: 0;
        background: #000;
      }

      .threejs-controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
        color: white;
        font-family: monospace;
        font-size: 12px;
      }

      /* Text/JSON Viewer */
      .text-viewer {
        position: fixed;
        inset: 20px;
        background: #1e1e1e;
        color: #d4d4d4;
        font-family: "Courier New", monospace;
        font-size: 14px;
        line-height: 1.5;
        overflow: auto;
        padding: 20px;
        border-radius: 5px;
      }

      .json-viewer {
        white-space: pre-wrap;
      }

      .json-key {
        color: #9cdcfe;
      }

      .json-string {
        color: #ce9178;
      }

      .json-number {
        color: #b5cea8;
      }

      .json-boolean {
        color: #569cd6;
      }

      .json-null {
        color: #569cd6;
      }

      /* HTML Viewer */
      .html-viewer {
        position: fixed;
        inset: 0;
        border: none;
        background: white;
        width: 100vw;
        height: 100vh;
        z-index: 999;
      }

      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 18px;
      }

      .error {
        color: #ff6b6b;
        text-align: center;
        padding: 20px;
      }

    <script>
      // SHA256 implementation for hash verification
      async function sha256(buffer) {
        const data = new Uint8Array(buffer);
        const totalBlocks = Math.ceil((data.length + 9) / 64);
        let processedBlocks = 0;

        function rightRotate(value, amount) {
          return (value >>> amount) | (value << (32 - amount));
        }

        const k = [
          0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5,
          0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
          0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3,
          0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
          0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc,
          0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
          0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7,
          0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
          0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,
          0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
          0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3,
          0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
          0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5,
          0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
          0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
          0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
        ];

        let h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
                 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];

        const len = data.length * 8;
        const padding = new Uint8Array(64 - ((data.length + 9) % 64));
        const padded = new Uint8Array(data.length + 1 + padding.length + 8);

        padded.set(data);
        padded[data.length] = 0x80;

        const view = new DataView(padded.buffer);
        view.setUint32(padded.length - 4, len, false);

        for (let i = 0; i < padded.length; i += 64) {
          processedBlocks++;

          if (processedBlocks % 4096 === 0) {
            const progress = Math.floor((processedBlocks / totalBlocks) * 100);
            debug.innerHTML = debug.innerHTML.split('<br>Hashing:')[0] +
                             '<br>Hashing: ' + progress + '%';
            await new Promise(resolve => setTimeout(resolve, 0));
          }

          const w = new Array(64);
          for (let j = 0; j < 16; j++) {
            w[j] = view.getUint32(i + j * 4, false);
          }

          for (let j = 16; j < 64; j++) {
            const s0 = rightRotate(w[j-15], 7) ^ rightRotate(w[j-15], 18) ^ (w[j-15] >>> 3);
            const s1 = rightRotate(w[j-2], 17) ^ rightRotate(w[j-2], 19) ^ (w[j-2] >>> 10);
            w[j] = (w[j-16] + s0 + w[j-7] + s1) >>> 0;
          }

          let [a, b, c, d, e, f, g, h0] = h;

          for (let j = 0; j < 64; j++) {
            const S1 = rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25);
            const ch = (e & f) ^ (~e & g);
            const temp1 = (h0 + S1 + ch + k[j] + w[j]) >>> 0;
            const S0 = rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22);
            const maj = (a & b) ^ (a & c) ^ (b & c);
            const temp2 = (S0 + maj) >>> 0;

            h0 = g;
            g = f;
            f = e;
            e = (d + temp1) >>> 0;
            d = c;
            c = b;
            b = a;
            a = (temp1 + temp2) >>> 0;
          }

          h = h.map((x, i) => (x + [a, b, c, d, e, f, g, h0][i]) >>> 0);
        }

        return h.map(x => x.toString(16).padStart(8, '0')).join('');
      }

      // Load a script from multiple URIs with optional hash verification
      async function loadScriptFromURIs(uris, scriptName, expectedScriptHash) {
        for (let i = 0; i < uris.length; i++) {
          const uri = uris[i];
          try {
            debug.innerHTML += '<br>Loading ' + scriptName + ' from: ' + uri.substring(0, 30) + '...';

            const response = await fetch(uri, { mode: 'cors' });
            if (response.status === 200) {
              const scriptText = await response.text();

              // Verify hash if provided
              if (expectedScriptHash && expectedScriptHash.length > 0) {
                debug.innerHTML += '<br>Verifying ' + scriptName + ' hash...';

                const encoder = new TextEncoder();
                const scriptBuffer = encoder.encode(scriptText);
                const hashHex = await sha256(scriptBuffer);
                const cleanExpected = expectedScriptHash.replace('0x', '');

                if (hashHex !== cleanExpected) {
                  debug.innerHTML += '<br>' + scriptName + ' hash mismatch, trying next URI';
                  continue;
                }

                debug.innerHTML += '<br>' + scriptName + ' hash verified!';
              }

              // Create and inject script
              const script = document.createElement('script');
              script.textContent = scriptText;
              document.head.appendChild(script);

              debug.innerHTML += '<br>' + scriptName + ' loaded successfully';
              return true;
            }
          } catch (e) {
            debug.innerHTML += '<br>' + scriptName + ' failed from this URI: ' + e.message;
          }
        }

        debug.innerHTML += '<br>ERROR: Could not load ' + scriptName;
        return false;
      }

      // Load all Three.js dependencies
      async function loadThreeJS() {
        if (threejsLoaded) return true;

        debug.innerHTML += '<br>Loading Three.js libraries...';

        // Load in order: Core → GLTFLoader → OrbitControls
        const coreLoaded = await loadScriptFromURIs(
          threejsLibraries.core.uris,
          'Three.js Core',
          threejsLibraries.core.expectedHash
        );
        if (!coreLoaded) return false;

        const gltfLoaded = await loadScriptFromURIs(
          threejsLibraries.gltfLoader.uris,
          'GLTFLoader',
          threejsLibraries.gltfLoader.expectedHash
        );
        if (!gltfLoaded) return false;

        const controlsLoaded = await loadScriptFromURIs(
          threejsLibraries.orbitControls.uris,
          'OrbitControls',
          threejsLibraries.orbitControls.expectedHash
        );
        if (!controlsLoaded) return false;

        threejsLoaded = true;
        debug.innerHTML += '<br>All Three.js libraries loaded!';
        return true;
      }

      // Media type detection
      function detectMediaType(arrayBuffer, uri) {
        const uint8Array = new Uint8Array(arrayBuffer);
        const header = Array.from(uint8Array.slice(0, 16))
          .map(b => b.toString(16).padStart(2, '0'))
          .join('');

        // Check data URI scheme
        if (uri.startsWith('data:')) {
          const mimeMatch = uri.match(/data:([^;]+)/);
          if (mimeMatch) {
            const mimeType = mimeMatch[1];
            if (mimeType.startsWith('image/')) return 'image';
            if (mimeType.startsWith('video/')) return 'video';
            if (mimeType.startsWith('audio/')) return 'audio';
            if (mimeType === 'text/html') return 'html';
            if (mimeType === 'application/json') return 'json';
            if (mimeType.startsWith('text/')) return 'text';
            if (mimeType === 'model/gltf+json') return '3d';
          }
        }

        // Magic number detection
        // Images
        if (header.startsWith('ffd8ff')) return 'image'; // JPEG
        if (header.startsWith('89504e47')) {
          // Check if it's APNG (Animated PNG) or regular PNG
          // Both are handled the same way by the browser
          return 'image'; // PNG/APNG
        }
        if (header.startsWith('47494638')) return 'image'; // GIF
        if (header.startsWith('52494646') && uint8Array[8] === 0x57 && uint8Array[9] === 0x45 && uint8Array[10] === 0x42 && uint8Array[11] === 0x50) return 'image'; // WebP
        if (header.startsWith('00000020667479706176696601') || header.startsWith('0000001c667479706176696601')) return 'image'; // AVIF
        if (header.startsWith('424d')) return 'image'; // BMP
        if (header.startsWith('00000100') || header.startsWith('00000200')) return 'image'; // ICO
        if (header.startsWith('49492a00') || header.startsWith('4d4d002a')) return 'image'; // TIFF
        if (header.startsWith('3c3f786d6c') || header.startsWith('3c737667')) return 'image'; // SVG

        // Videos
        // MP4 container (H.264/AVC, H.265/HEVC, AV1)
        if (header.includes('667479706d703432') || header.includes('667479706d703431') || header.includes('6674797069736f6d')) return 'video'; // MP4
        if (header.startsWith('464c5601')) return 'video'; // FLV

        // WebM/MKV container (VP8, VP9, AV1)
        if (header.startsWith('1a45dfa3')) {
          // Look deeper into the file to determine if it's audio-only WebM
          const extendedHeader = Array.from(uint8Array.slice(0, 200)).map(b => b.toString(16).padStart(2, '0')).join('');
          // Check for video track indicators vs audio-only indicators
          if (extendedHeader.includes('56503830') || extendedHeader.includes('56503930') || extendedHeader.includes('415631')) {
            return 'video'; // WebM with video (VP8/VP9/AV1)
          } else if (extendedHeader.includes('566f72626973') || extendedHeader.includes('4f707573')) {
            return 'audio'; // WebM with audio only (Vorbis/Opus)
          }
          return 'video'; // Default to video for WebM if uncertain
        }

        // AVI container
        if (header.startsWith('52494646') && uint8Array[8] === 0x41 && uint8Array[9] === 0x56 && uint8Array[10] === 0x49 && uint8Array[11] === 0x20) return 'video'; // AVI

        // QuickTime/MOV container
        if (header.includes('6674797071742020') || header.includes('6d6f6f76')) return 'video'; // QuickTime/MOV

        // 3GPP container (H.263, H.264, MPEG-4)
        if (header.includes('667479703367702') || header.includes('667479703367703')) return 'video'; // 3GP/3G2

        // MPEG container (MPEG-1, MPEG-2)
        if (header.startsWith('000001ba') || header.startsWith('000001b3')) return 'video'; // MPEG-1/MPEG-2

        // OGV (Ogg Video with Theora)
        if (header.startsWith('4f676753') && uint8Array.slice(28, 35).includes(0x74, 0x68, 0x65, 0x6f, 0x72, 0x61)) return 'video'; // OGV (Theora)

        // Audio
        if (header.startsWith('494433') || header.startsWith('fff3') || header.startsWith('fff2')) return 'audio'; // MP3
        if (header.startsWith('4f676753')) return 'audio'; // OGG
        if (header.startsWith('52494646') && uint8Array[8] === 0x57 && uint8Array[9] === 0x41 && uint8Array[10] === 0x56 && uint8Array[11] === 0x45) return 'audio'; // WAV
        if (header.startsWith('664c6143')) return 'audio'; // FLAC

        // M4A/AAC Audio (MP4 container with audio)
        if (header.includes('6674797') && (header.includes('4d344120') || header.includes('4d344120') || header.includes('69736f6d'))) {
          // Check if it's audio by looking for audio-specific atoms or lack of video atoms
          const fullHeader = Array.from(uint8Array.slice(0, 64)).map(b => b.toString(16).padStart(2, '0')).join('');
          if (fullHeader.includes('6d703461') || fullHeader.includes('4d344120') || !fullHeader.includes('61766331')) {
            return 'audio'; // M4A/AAC
          }
        }

        // 3D Models
        if (header.startsWith('676c5446')) return '3d'; // glTF binary (GLB)
        const textContent = new TextDecoder().decode(uint8Array.slice(0, 200));
        if (textContent.includes('"asset"') && textContent.includes('"version"') && textContent.includes('"generator"')) return '3d'; // glTF JSON

        // Text formats
        try {
          const text = new TextDecoder().decode(arrayBuffer);
          if (text.trim().startsWith('{') && text.trim().endsWith('}')) {
            JSON.parse(text);
            return 'json';
          }
          if (text.includes('<html') || text.includes('<!DOCTYPE')) return 'html';
          return 'text';
        } catch (e) {
          // Not valid text
        }

        return 'unknown';
      }

      // Calculate hash of array buffer
      async function calculateHash(arrayBuffer) {
        try {
          return await sha256(arrayBuffer);
        } catch (e) {
          debug.innerHTML += '<br>Hash error: ' + e.message;
          return null;
        }
      }

      // Media rendering functions
      function renderImage(uri, arrayBuffer) {
        const content = document.getElementById('content');

        // Create image display stage (existing code)
        const stage = document.createElement('div');
        stage.className = 'stage';

        const panzoom = document.createElement('div');
        panzoom.className = 'panzoom';

        const img = document.createElement('img');
        img.src = uri;

        // Pan/zoom state
        let scale = 1, minScale = 1, x = 0, y = 0;
        const zoomFactors = [1, 2, 3];
        let zoomIndex = 0;

        // Clamp position within bounds
        function clampPosition() {
          const sw = stage.clientWidth, sh = stage.clientHeight;
          const iw = img.naturalWidth || 0, ih = img.naturalHeight || 0;
          const dw = iw * scale, dh = ih * scale;

          if (dw <= sw) {
            x = Math.round((sw - dw) / 2);
          } else {
            if (x > 0) x = 0;
            if (x < sw - dw) x = Math.round(sw - dw);
          }

          if (dh <= sh) {
            y = Math.round((sh - dh) / 2);
          } else {
            if (y > 0) y = 0;
            if (y < sh - dh) y = Math.round(sh - dh);
          }
        }

        // Apply current transform
        function applyTransform() {
          clampPosition();
          panzoom.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + scale + ')';
        }

        // Set zoom level at specific point
        function setZoomAt(factor, cx, cy) {
          const newScale = Math.max(minScale, Math.min(10, minScale * factor));
          const k = newScale / scale;
          x = cx - (cx - x) * k;
          y = cy - (cy - y) * k;
          scale = newScale;
          applyTransform();
        }

        // Handle image load
        img.onload = () => {
          const sw = stage.clientWidth, sh = stage.clientHeight;
          const iw = img.naturalWidth, ih = img.naturalHeight;

          minScale = Math.min(sw / iw, sh / ih);
          scale = minScale;
          x = Math.round((sw - iw * scale) / 2);
          y = Math.round((sh - ih * scale) / 2);

          applyTransform();
          panzoom.style.visibility = 'visible';
          debug.style.display = 'none';
        };

        // Pan/zoom interaction variables
        let isPanning = false, startX = 0, startY = 0, startTX = 0, startTY = 0, moved = false;

        // Pointer down - start panning
        stage.addEventListener('pointerdown', (e) => {
          isPanning = true;
          moved = false;
          startX = e.clientX;
          startY = e.clientY;
          startTX = x;
          startTY = y;
          stage.setPointerCapture(e.pointerId);
          stage.classList.add('grabbing');
        });

        // Pointer move - pan image
        stage.addEventListener('pointermove', (e) => {
          if (!isPanning) return;

          const dx = e.clientX - startX;
          const dy = e.clientY - startY;

          if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;

          x = startTX + dx;
          y = startTY + dy;
          applyTransform();
        });

        // End panning
        const endPan = (e) => {
          if (!isPanning) return;
          isPanning = false;
          stage.releasePointerCapture(e.pointerId);
          stage.classList.remove('grabbing');
        };

        // Pointer up - end pan or zoom on tap
        stage.addEventListener('pointerup', (e) => {
          const rect = stage.getBoundingClientRect();
          const cx = e.clientX - rect.left;
          const cy = e.clientY - rect.top;
          const wasMoved = moved;
          endPan(e);

          if (!wasMoved) {
            // Tap to zoom
            zoomIndex = (zoomIndex + 1) % zoomFactors.length;
            setZoomAt(zoomFactors[zoomIndex], cx, cy);
          }
        });

        // Pointer cancel
        stage.addEventListener('pointercancel', endPan);

        // Mouse wheel zoom
        stage.addEventListener('wheel', (e) => {
          e.preventDefault();
          const rect = stage.getBoundingClientRect();
          const cx = e.clientX - rect.left;
          const cy = e.clientY - rect.top;
          const zoom = Math.exp(-e.deltaY * 0.0015);
          const newScale = Math.max(minScale, Math.min(10, scale * zoom));
          const k = newScale / scale;
          x = cx - (cx - x) * k;
          y = cy - (cy - y) * k;
          scale = newScale;
          applyTransform();
        }, { passive: false });

        // Window resize
        window.addEventListener('resize', () => {
          const sw = stage.clientWidth, sh = stage.clientHeight;
          const iw = img.naturalWidth, ih = img.naturalHeight;
          const newMin = Math.min(sw / iw, sh / ih);
          minScale = newMin;
          if (scale < minScale) {
            scale = minScale;
          }
          applyTransform();
        });

        // Replace content with image viewer
        content.innerHTML = '';
        content.appendChild(stage);
        stage.appendChild(panzoom);
        panzoom.appendChild(img);
      }

      function renderVideo(uri) {
        const content = document.getElementById('content');
        const container = document.createElement('div');
        container.className = 'media-container';

        const video = document.createElement('video');
        video.className = 'video-player';
        video.src = uri;
        video.controls = true;
        video.autoplay = false;
        video.style.maxWidth = '100%';
        video.style.maxHeight = '100%';

        container.appendChild(video);
        content.innerHTML = '';
        content.appendChild(container);
        debug.style.display = 'none';
      }

      function renderAudio(uri) {
        const content = document.getElementById('content');
        const container = document.createElement('div');
        container.className = 'media-container';

        const audio = document.createElement('audio');
        audio.className = 'audio-player';
        audio.src = uri;
        audio.controls = true;
        audio.style.width = '100%';

        container.appendChild(audio);
        content.innerHTML = '';
        content.appendChild(container);
        debug.style.display = 'none';
      }

      async function render3D(uri, arrayBuffer) {
        const content = document.getElementById('content');
        const container = document.createElement('div');
        container.className = 'threejs-container';
        container.innerHTML = '<div class="loading">Loading 3D model...</div>';

        const controls = document.createElement('div');
        controls.className = 'threejs-controls';
        controls.innerHTML = 'Loading Three.js libraries...';

        content.innerHTML = '';
        content.appendChild(container);
        content.appendChild(controls);

        // Load Three.js libraries first
        const loaded = await loadThreeJS();
        if (!loaded) {
          container.innerHTML = '<div class="error">Failed to load Three.js libraries<br>Check console for details</div>';
          return;
        }

        controls.innerHTML = 'Mouse: Rotate | Wheel: Zoom | Right-click: Pan';

        // Initialize Three.js scene
        try {
          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x000000);

          const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
          const renderer = new THREE.WebGLRenderer({ antialias: true });
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;

          container.innerHTML = '';
          container.appendChild(renderer.domElement);

          // Add lights
          const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
          scene.add(ambientLight);

          const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
          directionalLight.position.set(10, 10, 5);
          directionalLight.castShadow = true;
          scene.add(directionalLight);

          // Add orbit controls
          const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
          orbitControls.enableDamping = true;
          orbitControls.dampingFactor = 0.05;

          // Detect if this is GLB (binary) or GLTF (JSON)
          const uint8Array = new Uint8Array(arrayBuffer);
          const isGLB = uint8Array[0] === 0x67 && uint8Array[1] === 0x6C && uint8Array[2] === 0x54 && uint8Array[3] === 0x46;

          if (!isGLB) {
            // For GLTF JSON files, check if they reference external files
            try {
              const gltfText = new TextDecoder().decode(arrayBuffer);
              const gltfJson = JSON.parse(gltfText);

              // Check for external buffer references
              if (gltfJson.buffers && gltfJson.buffers.some(buffer => buffer.uri && !buffer.uri.startsWith('data:'))) {
                container.innerHTML = '<div class="error">GLTF with external files not supported<br>Please use GLB (binary) format or embedded GLTF</div>';
                return;
              }
            } catch (e) {
              container.innerHTML = '<div class="error">Invalid GLTF file format</div>';
              return;
            }
          }

          // Load model
          const loader = new THREE.GLTFLoader();

          // Create blob URL from array buffer
          const blob = new Blob([arrayBuffer], {
            type: isGLB ? 'model/gltf-binary' : 'model/gltf+json'
          });
          const blobUrl = URL.createObjectURL(blob);

          loader.load(
            blobUrl,
            function (gltf) {
              const model = gltf.scene;

              if (!model || model.children.length === 0) {
                container.innerHTML = '<div class="error">No 3D geometry found in model</div>';
                URL.revokeObjectURL(blobUrl);
                return;
              }

              scene.add(model);

              // Center and scale model
              const box = new THREE.Box3().setFromObject(model);
              const center = box.getCenter(new THREE.Vector3());
              const size = box.getSize(new THREE.Vector3());

              const maxDim = Math.max(size.x, size.y, size.z);
              if (maxDim > 0) {
                const scale = 2 / maxDim;
                model.scale.setScalar(scale);
                model.position.sub(center.multiplyScalar(scale));
              }

              // Position camera
              camera.position.set(0, 0, 3);
              camera.lookAt(0, 0, 0);

              // Clean up blob URL
              URL.revokeObjectURL(blobUrl);

              controls.innerHTML = 'Mouse: Rotate | Wheel: Zoom | Right-click: Pan | Model loaded successfully';
            },
            function (progress) {
              if (progress.total > 0) {
                const percent = Math.round((progress.loaded / progress.total) * 100);
                controls.innerHTML = 'Loading 3D model: ' + percent + '%';
              }
            },
            function (error) {
              console.error('Error loading 3D model:', error);
              URL.revokeObjectURL(blobUrl);

              let errorMessage = 'Error loading 3D model';
              if (error.message.includes('buffer')) {
                errorMessage = 'Model references external files<br>Use GLB format for self-contained models';
              } else if (error.message.includes('JSON')) {
                errorMessage = 'Invalid GLTF format<br>Check file structure';
              }

              container.innerHTML = '<div class="error">' + errorMessage + '</div>';
            }
          );

          // Animation loop
          function animate() {
            requestAnimationFrame(animate);
            orbitControls.update();
            renderer.render(scene, camera);
          }
          animate();

          // Handle window resize
          window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
          });

        } catch (error) {
          console.error('Three.js initialization error:', error);
          container.innerHTML = '<div class="error">Three.js not available<br>3D models require Three.js library</div>';
        }

        debug.style.display = 'none';
      }

      function renderHTML(arrayBuffer) {
        const content = document.getElementById('content');
        const htmlContent = new TextDecoder().decode(arrayBuffer);

        // Hide debug panel immediately
        debug.style.display = 'none';

        // Create fullscreen iframe
        const iframe = document.createElement('iframe');
        iframe.className = 'html-viewer';
        iframe.srcdoc = htmlContent;
        iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals';
        iframe.style.position = 'fixed';
        iframe.style.top = '0';
        iframe.style.left = '0';
        iframe.style.width = '100vw';
        iframe.style.height = '100vh';
        iframe.style.border = 'none';
        iframe.style.zIndex = '9999';
        iframe.style.background = 'white';

        // Clear all content and add iframe to body directly for full control
        document.body.innerHTML = '';
        document.body.appendChild(iframe);

        // Ensure body takes full viewport
        document.body.style.margin = '0';
        document.body.style.padding = '0';
        document.body.style.overflow = 'hidden';
      }

      function renderText(arrayBuffer) {
        const content = document.getElementById('content');
        const textContent = new TextDecoder().decode(arrayBuffer);

        const viewer = document.createElement('div');
        viewer.className = 'text-viewer';
        viewer.textContent = textContent;

        content.innerHTML = '';
        content.appendChild(viewer);
        debug.style.display = 'none';
      }

      function renderJSON(arrayBuffer) {
        const content = document.getElementById('content');
        const jsonText = new TextDecoder().decode(arrayBuffer);

        try {
          const jsonObj = JSON.parse(jsonText);
          const formatted = JSON.stringify(jsonObj, null, 2);

          const viewer = document.createElement('div');
          viewer.className = 'text-viewer json-viewer';

          // Simple syntax highlighting
          const highlighted = formatted
            .replace(/"([^"]+)":/g, '<span class="json-key">"$1"</span>:')
            .replace(/: "([^"]*)"/g, ': <span class="json-string">"$1"</span>')
            .replace(/: (\d+)/g, ': <span class="json-number">$1</span>')
            .replace(/: (true|false)/g, ': <span class="json-boolean">$1</span>')
            .replace(/: null/g, ': <span class="json-null">null</span>');

          viewer.innerHTML = highlighted;

          content.innerHTML = '';
          content.appendChild(viewer);
        } catch (e) {
          renderText(arrayBuffer);
        }

        debug.style.display = 'none';
      }

      // Main media loading function
      async function loadMedia() {
        const content = document.getElementById('content');

        for (let i = 0; i < mediaUris.length; i++) {
          const uri = mediaUris[i];

          try {
            debug.innerHTML += '<br>Trying: ' + uri.substring(0, 30) + '...';

            const response = await fetch(uri, { mode: 'cors' });
            debug.innerHTML += '<br>Status: ' + response.status;

            if (response.status === 200) {
              const arrayBuffer = await response.arrayBuffer();
              debug.innerHTML += '<br>Size: ' + arrayBuffer.byteLength;

              if (!expectedHash || expectedHash.length === 0) {
                debug.innerHTML += '<br>NO EXPECTED HASH - Cannot verify';
                continue;
              }

              const fileSizeMB = (arrayBuffer.byteLength / (1024 * 1024)).toFixed(1);
              debug.innerHTML += '<br>Hashing ' + fileSizeMB + 'MB file...';

              const hashHex = await calculateHash(arrayBuffer);

              if (!hashHex) {
                debug.innerHTML += '<br>Hash calculation failed';
                continue;
              }

              debug.innerHTML += '<br>Hash: ' + hashHex.substring(0, 16) + '...';

              const cleanExpected = expectedHash.replace('0x', '');
              if (hashHex === cleanExpected) {
                debug.innerHTML += '<br>HASH MATCH! Loading...';

                // Detect media type and render accordingly
                const mediaType = detectMediaType(arrayBuffer, uri);
                debug.innerHTML += '<br>Media type: ' + mediaType;

                switch (mediaType) {
                  case 'image':
                    renderImage(uri, arrayBuffer);
                    break;
                  case 'video':
                    renderVideo(uri);
                    break;
                  case 'audio':
                    renderAudio(uri);
                    break;
                  case '3d':
                    render3D(uri, arrayBuffer);
                    break;
                  case 'html':
                    renderHTML(arrayBuffer);
                    break;
                  case 'json':
                    renderJSON(arrayBuffer);
                    break;
                  case 'text':
                    renderText(arrayBuffer);
                    break;
                  default:
                    content.innerHTML = '<div class="error">Unsupported media type: ' + mediaType + '</div>';
                    debug.style.display = 'none';
                }

                return;
              } else {
                debug.innerHTML += '<br>Hash mismatch';
              }
            }
          } catch (e) {
            debug.innerHTML += '<br>Error: ' + e.message;
          }
        }

        content.innerHTML = 'No media with matching hash found. All media failed hash verification.';
      }

      // Start loading process
      loadMedia();
    </script>
  </body>
</html>
