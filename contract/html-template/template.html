<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MURI Protocol Resolver</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #debug {
      position: fixed;
      top: 10px;
      left: 10px;
      font: 12px monospace;
      max-width: 300px;
      white-space: pre-wrap;
      word-break: break-all;
      z-index: 1000;
    }

    /* Image viewer */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    .grabbing {
      cursor: grabbing;
    }

    .panzoom {
      transform-origin: 0 0;
      visibility: hidden;
    }

    .panzoom img {
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Video, audio and 3D */
    .media,
    .three {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      max-width: 100%;
      max-height: 100%;
    }

    audio {
      width: 90vw;
    }

    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      font: 12px monospace;
    }

    /* Text and JSON viewer */
    .text {
      position: fixed;
      inset: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
      font: 14px/1.5 "Courier New", monospace;
      overflow: auto;
      padding: 20px;
      border-radius: 5px;
      white-space: pre-wrap;
    }

    .json-key {
      color: #9cdcfe;
    }

    .json-string {
      color: #ce9178;
    }

    .json-number {
      color: #b5cea8;
    }

    .json-boolean,
    .json-null {
      color: #569cd6;
    }

    /* HTML artwork */
    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      background: #fff;
    }

    .error {
      color: #ff6b6b;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>
  <div id="content">Loading...</div>
  <div id="debug"></div>

  <script>
    // The artwork's hash and URIs are read from the <plaintext> element at the very end of the
    // page, never placed inside this script, so a hostile URI can't inject code. Everything that
    // comes from there (URIs, error messages, file contents) is shown with textContent only.
    const contentBox = document.getElementById('content');
    const debugBox = document.getElementById('debug');

    // On-screen log. The last line can be a progress line that is replaced instead of appended.
    const logLines = [];
    let progressLine = '';

    function showLog() {
      debugBox.textContent = logLines.concat(progressLine || []).join('\n');
    }

    function log(line) {
      logLines.push(line);
      progressLine = '';
      showLog();
    }

    function progress(line) {
      progressLine = line;
      showLog();
    }

    // Replace the page content with a viewer and hide the log
    function showView(...elements) {
      contentBox.replaceChildren(...elements);
      debugBox.hidden = true;
    }

    function showError(message) {
      const div = document.createElement('div');
      div.className = 'error';
      div.textContent = message;
      contentBox.replaceChildren(div);
    }

    // ---------------------------------------------------------------------------------------
    // SHA-256. crypto.subtle only exists in secure contexts, and Chromium never treats a page
    // opened from a data: URI as one (that is how marketplaces show animation_url), so the
    // plain JS version below is often the one that runs. Its constants are the first 32 bits
    // of the fractional parts of the square roots (initial hash) and cube roots (round
    // constants) of the first primes.
    const SHA_H = [];
    const SHA_K = [];
    for (let n = 2; SHA_K.length < 64; n++) {
      let isPrime = true;
      for (let d = 2; d * d <= n; d++) {
        if (n % d == 0) isPrime = false;
      }
      if (isPrime) {
        if (SHA_H.length < 8) SHA_H.push(Math.sqrt(n) * 2 ** 32 | 0);
        SHA_K.push(Math.cbrt(n) * 2 ** 32 | 0);
      }
    }

    const rotr = (x, n) => x >>> n | x << 32 - n;

    async function sha256js(data) {
      const n = data.length;
      // Message + 0x80 + zero padding + 64-bit big-endian bit length, a multiple of 64 bytes
      const size = n + 9 + (64 - (n + 9) % 64) % 64;
      const m = new Uint8Array(size);
      m.set(data);
      m[n] = 0x80;
      const view = new DataView(m.buffer);
      view.setUint32(size - 8, n / 2 ** 29);
      view.setUint32(size - 4, n * 8);

      const h = SHA_H.slice();
      const w = new Int32Array(64);
      for (let i = 0; i < size; i += 64) {
        // Every 1 MiB, show progress and let the page repaint
        if (i && i % 1048576 == 0) {
          progress('Hashing ' + Math.floor(i * 100 / size) + '%');
          await new Promise(resolve => setTimeout(resolve));
        }
        for (let j = 0; j < 64; j++) {
          if (j < 16) {
            w[j] = view.getInt32(i + j * 4);
          } else {
            const a = w[j - 15], b = w[j - 2];
            w[j] = (rotr(a, 7) ^ rotr(a, 18) ^ a >>> 3) + (rotr(b, 17) ^ rotr(b, 19) ^ b >>> 10) + w[j - 7] + w[j - 16];
          }
        }
        let [a, b, c, d, e, f, g, hh] = h;
        for (let j = 0; j < 64; j++) {
          const t1 = hh + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + (e & f ^ ~e & g) + SHA_K[j] + w[j] | 0;
          const t2 = (rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + (a & b ^ a & c ^ b & c) | 0;
          hh = g;
          g = f;
          f = e;
          e = d + t1 | 0;
          d = c;
          c = b;
          b = a;
          a = t1 + t2 | 0;
        }
        [a, b, c, d, e, f, g, hh].forEach((x, j) => h[j] = h[j] + x | 0);
      }
      return h.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
    }

    async function sha256(data) {
      try {
        const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', data));
        return Array.from(digest, x => x.toString(16).padStart(2, '0')).join('');
      } catch (e) {
        return sha256js(data);
      }
    }

    // ---------------------------------------------------------------------------------------
    // Downloading. ar:// and ipfs:// can be served by many gateways, and any one of them can go
    // down or rate-limit, so each is expanded into several gateway URLs, tried in order.
    const IPFS_GATEWAYS = [
      'https://ipfs.filebase.io/ipfs/',
      'https://gateway.pinata.cloud/ipfs/',
      'https://4everland.io/ipfs/',
      'https://dweb.link/ipfs/',
      'https://ipfs.io/ipfs/'
    ];
    const ARWEAVE_GATEWAYS = [
      'https://arweave.net/',
      'https://turbo-gateway.com/'
    ];

    function expandUri(uri) {
      if (uri.startsWith('ar://')) {
        return ARWEAVE_GATEWAYS.map(gateway => gateway + uri.slice(5));
      }
      if (uri.startsWith('ipfs://')) {
        // ipfs://ipfs/<cid> is a common variant of ipfs://<cid>
        return IPFS_GATEWAYS.map(gateway => gateway + uri.slice(7).replace(/^ipfs\//, ''));
      }
      return [uri];
    }

    // Give up on a host that sends no response for 15s, or stalls for 20s in the middle of the
    // body, so the next copy is tried. A slow but steady download is never cut off.
    async function download(uri) {
      const controller = new AbortController();
      let timer;
      const abortAfter = ms => {
        clearTimeout(timer);
        timer = setTimeout(() => controller.abort(), ms);
      };
      abortAfter(15000);
      try {
        const response = await fetch(uri, { signal: controller.signal });
        if (!response.ok) throw Error('HTTP ' + response.status);
        if (!response.body) {
          clearTimeout(timer);
          return new Uint8Array(await response.arrayBuffer());
        }
        const total = +response.headers.get('content-length');
        const reader = response.body.getReader();
        const chunks = [];
        let size = 0;
        for (;;) {
          abortAfter(20000);
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          size += value.length;
          if (total) progress('Downloading ' + Math.min(100, Math.floor(size * 100 / total)) + '%');
        }
        const data = new Uint8Array(size);
        size = 0;
        for (const chunk of chunks) {
          data.set(chunk, size);
          size += chunk.length;
        }
        return data;
      } finally {
        clearTimeout(timer);
      }
    }

    // Try each copy in order and return [bytes, uri] for the first whose SHA-256 matches
    async function fetchVerified(uris, hash) {
      for (const uri of uris) {
        try {
          log('Trying ' + uri.slice(0, 40));
          const data = await download(uri);
          log('Hashing ' + data.length + ' bytes');
          const actual = await sha256(data);
          if (actual == hash) return [data, uri];
          log('Hash mismatch ' + actual.slice(0, 16));
        } catch (e) {
          log('Failed: ' + e.message);
        }
      }
    }

    // ---------------------------------------------------------------------------------------
    // Media type detection from the file's first bytes. Returns a MIME type, or '' if unknown.
    function detectType(data) {
      const head = String.fromCharCode(...data.subarray(0, 4096));
      const at = (signature, offset) => head.startsWith(signature, offset);
      const brand = at('ftyp', 4) ? head.slice(8, 12) : '';

      // Images
      if (at('\x89PNG')) return 'image/png';
      if (at('\xff\xd8\xff')) return 'image/jpeg';
      if (at('GIF8')) return 'image/gif';
      if (at('RIFF')) {
        return at('WEBP', 8) ? 'image/webp' : at('WAVE', 8) ? 'audio/wav' : at('AVI ', 8) ? 'video/x-msvideo' : '';
      }
      if (brand && /avi[fs]/.test(head.slice(8, 32))) return 'image/avif';
      if (at('BM')) return 'image/bmp';
      if (at('\x00\x00\x01\x00') || at('\x00\x00\x02\x00')) return 'image/x-icon';
      if (at('II*\x00') || at('MM\x00*')) return 'image/tiff';

      // Video and audio
      if (brand == 'qt  ' || at('moov', 4)) return 'video/quicktime';
      if (/^M4[AB]/.test(brand)) return 'audio/mp4';
      if (brand.startsWith('3g')) return 'video/3gpp';
      if (brand) return 'video/mp4';
      if (at('\x1aE\xdf\xa3')) {
        // WebM/Matroska: audio only if it has an audio codec and no video codec
        return /A_(OPUS|VORBIS)/.test(head) && !/V_(VP|AV|MPEG)/.test(head) ? 'audio/webm' : 'video/webm';
      }
      if (at('OggS')) return head.slice(0, 64).includes('theora') ? 'video/ogg' : 'audio/ogg';
      if (at('FLV')) return 'video/x-flv';
      if (at('\x00\x00\x01\xba') || at('\x00\x00\x01\xb3')) return 'video/mpeg';
      if (at('ID3') || data[0] == 255 && data[1] >> 5 == 7) return 'audio/mpeg';
      if (at('fLaC')) return 'audio/flac';

      // 3D
      if (at('glTF')) return 'model/gltf-binary';

      // Text formats
      let text;
      try {
        text = new TextDecoder('utf-8', { fatal: true }).decode(data);
      } catch (e) {
        return '';
      }
      const start = text.trimStart().slice(0, 1024);
      if (/^(<\?xml|<svg|<!doctype svg)/i.test(start) && /<svg/i.test(start)) return 'image/svg+xml';
      if (/^[{[]/.test(start)) {
        try {
          const json = JSON.parse(text);
          return json.asset && json.asset.version ? 'model/gltf+json' : 'application/json';
        } catch (e) { }
      }
      if (/<html|<!doctype html/i.test(text)) return 'text/html';
      return 'text/plain';
    }

    // ---------------------------------------------------------------------------------------
    // Viewers

    // Image with pan and zoom (drag to pan, wheel or tap to zoom)
    function renderImage(url) {
      const stage = document.createElement('div');
      stage.className = 'stage';
      const panzoom = document.createElement('div');
      panzoom.className = 'panzoom';
      const img = document.createElement('img');
      stage.appendChild(panzoom);
      panzoom.appendChild(img);

      const zoomFactors = [1, 2, 3];
      let zoomIndex = 0, scale = 1, minScale = 1, x = 0, y = 0;

      // Keep the image centred when smaller than the stage, and its edges inside it otherwise
      function applyTransform() {
        const sw = stage.clientWidth, sh = stage.clientHeight;
        const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
        x = dw <= sw ? Math.round((sw - dw) / 2) : Math.min(0, Math.max(Math.round(sw - dw), x));
        y = dh <= sh ? Math.round((sh - dh) / 2) : Math.min(0, Math.max(Math.round(sh - dh), y));
        panzoom.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + scale + ')';
      }

      function fitScale() {
        minScale = Math.min(stage.clientWidth / img.naturalWidth, stage.clientHeight / img.naturalHeight);
      }

      // Zoom to newScale, keeping the point (cx, cy) of the stage still
      function zoomAt(newScale, event) {
        const rect = stage.getBoundingClientRect();
        const cx = event.clientX - rect.left, cy = event.clientY - rect.top;
        newScale = Math.max(minScale, Math.min(10, newScale));
        x = cx - (cx - x) * newScale / scale;
        y = cy - (cy - y) * newScale / scale;
        scale = newScale;
        applyTransform();
      }

      img.onload = () => {
        fitScale();
        scale = minScale;
        applyTransform();
        panzoom.style.visibility = 'visible';
      };
      img.onerror = () => showError('This image format cannot be displayed');

      let panning = false, moved = false, startX = 0, startY = 0, startTX = 0, startTY = 0;

      stage.addEventListener('pointerdown', e => {
        panning = true;
        moved = false;
        startX = e.clientX;
        startY = e.clientY;
        startTX = x;
        startTY = y;
        stage.setPointerCapture(e.pointerId);
        stage.classList.add('grabbing');
      });

      stage.addEventListener('pointermove', e => {
        if (!panning) return;
        const dx = e.clientX - startX, dy = e.clientY - startY;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
        x = startTX + dx;
        y = startTY + dy;
        applyTransform();
      });

      const endPan = e => {
        if (!panning) return;
        panning = false;
        stage.releasePointerCapture(e.pointerId);
        stage.classList.remove('grabbing');
      };

      // A tap without dragging steps through the zoom levels
      stage.addEventListener('pointerup', e => {
        const wasMoved = moved;
        endPan(e);
        if (!wasMoved) {
          zoomIndex = (zoomIndex + 1) % zoomFactors.length;
          zoomAt(minScale * zoomFactors[zoomIndex], e);
        }
      });

      stage.addEventListener('pointercancel', endPan);

      stage.addEventListener('wheel', e => {
        e.preventDefault();
        zoomAt(scale * Math.exp(-e.deltaY * 0.0015), e);
      }, { passive: false });

      window.addEventListener('resize', () => {
        fitScale();
        scale = Math.max(scale, minScale);
        applyTransform();
      });

      img.src = url;
      showView(stage);
    }

    // Video or audio player. kind is 'video' or 'audio'.
    function renderPlayer(kind, url) {
      const box = document.createElement('div');
      box.className = 'media';
      const player = document.createElement(kind);
      player.src = url;
      player.controls = true;
      box.appendChild(player);
      showView(box);
    }

    // Three.js r128 and its GLTFLoader and OrbitControls, loaded only for 3D files. Each is pinned
    // by hash and mirrored on two CDNs, IPFS and Arweave: [file, CDN directory, sha256, Arweave id]
    const THREE_LIBS = [
      ['three.min.js', 'build/', '9274bbcec8d96168626c732b5d31c775aa8cfb7eaa0599bec0c175908a2c1ce2', 'OZFWATgVxm_xRAxj-pC9RUwJjCC0zdVyBB6cDZMa21Q'],
      ['GLTFLoader.js', 'examples/js/loaders/', '5c15967ba830918a9caea6338712c994c354bccd4edc4569bde411c3ec06a3e6', 'GKpPF4sOEv6ak7lf8rurrTkBXOhbST0coaK6DA-XvaE'],
      ['OrbitControls.js', 'examples/js/controls/', '02bb4ade710f3e607329e37a21f098bc3ac70eb6e33daf8a65e79f4db785e7b2', 'FzH6rVdCxX-_2ZY37EsyFFCBDj7I09sR4T34v-JW22o']
    ];

    async function loadThree() {
      for (const [file, dir, hash, arweaveId] of THREE_LIBS) {
        const found = await fetchVerified([
          'https://cdn.jsdelivr.net/npm/three@0.128.0/' + dir + file,
          'https://unpkg.com/three@0.128.0/' + dir + file,
          'https://gateway.lighthouse.storage/ipfs/bafybeidkvmhsidcrkq45bncf2lfyiesszy4d3cbgsargqcyvss5hmmkzhy/' + file,
          ...expandUri('ar://' + arweaveId)
        ], hash);
        if (!found) return false;
        const script = document.createElement('script');
        script.textContent = new TextDecoder().decode(found[0]);
        document.head.appendChild(script);
      }
      return true;
    }

    // GLB, or glTF with embedded resources, in an orbitable scene
    async function render3D(data) {
      const box = document.createElement('div');
      box.className = 'three';
      const controls = document.createElement('div');
      controls.className = 'controls';
      controls.textContent = 'Loading 3D viewer...';
      contentBox.replaceChildren(box, controls);
      if (!await loadThree()) return showError('Could not load Three.js');

      try {
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        box.appendChild(renderer.domElement);
        showView(box, controls);

        scene.add(new THREE.AmbientLight(0x404040, 0.6));
        const light = new THREE.DirectionalLight(0xffffff, 0.8);
        light.position.set(10, 10, 5);
        light.castShadow = true;
        scene.add(light);

        const orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;
        orbit.dampingFactor = 0.05;
        camera.position.set(0, 0, 3);

        // Parse from the verified bytes; external .bin or texture files are not supported
        new THREE.GLTFLoader().parse(data.buffer, '', gltf => {
          const model = gltf.scene;
          // Centre the model and scale it to fit
          const bounds = new THREE.Box3().setFromObject(model);
          const size = bounds.getSize(new THREE.Vector3());
          const scale = 2 / (Math.max(size.x, size.y, size.z) || 1);
          model.scale.setScalar(scale);
          model.position.sub(bounds.getCenter(new THREE.Vector3()).multiplyScalar(scale));
          scene.add(model);
          controls.textContent = 'Mouse: Rotate | Wheel: Zoom | Right-click: Pan';
        }, e => showError('Could not load 3D model (use GLB or embedded glTF): ' + e.message));

        (function animate() {
          requestAnimationFrame(animate);
          orbit.update();
          renderer.render(scene, camera);
        })();

        window.addEventListener('resize', () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        });
      } catch (e) {
        showError('3D error: ' + e.message);
      }
    }

    // HTML artwork runs in a sandboxed iframe with an opaque origin
    function renderHTML(text) {
      const iframe = document.createElement('iframe');
      iframe.sandbox = 'allow-scripts allow-forms allow-popups allow-modals';
      iframe.srcdoc = text;
      document.body.replaceChildren(iframe);
    }

    function renderText(text) {
      const viewer = document.createElement('div');
      viewer.className = 'text';
      viewer.textContent = text;
      showView(viewer);
    }

    // Pretty-printed JSON. The text is HTML-escaped first, so only our own spans become markup.
    function renderJSON(text) {
      const viewer = document.createElement('div');
      viewer.className = 'text';
      viewer.innerHTML = JSON.stringify(JSON.parse(text), null, 2)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g,
          (match, string, colon, word) => '<span class="json-' +
            (string ? (colon ? 'key' : 'string') : word ? (word == 'null' ? 'null' : 'boolean') : 'number') +
            '">' + (string || match) + '</span>' + (colon || ''));
      showView(viewer);
    }

    function render(data, uri) {
      // A data: URI states its own type; otherwise look at the bytes
      const declared = uri.startsWith('data:') ? uri.slice(5).split(/[;,]/)[0] : '';
      const type = /^(image|video|audio|model|text)\/|json$/.test(declared) ? declared : detectType(data);
      const kind = type.split('/')[0];
      log('Type: ' + (type || 'unknown'));

      if (kind == 'image' || kind == 'video' || kind == 'audio') {
        // Show the verified bytes themselves; fetching the URI again could return other content
        const url = URL.createObjectURL(new Blob([data], { type }));
        if (kind == 'image') renderImage(url);
        else renderPlayer(kind, url);
      } else if (kind == 'model') {
        render3D(data);
      } else if (type) {
        const text = new TextDecoder().decode(data);
        if (type.endsWith('html')) renderHTML(text);
        else if (type.endsWith('json')) {
          try {
            renderJSON(text);
          } catch (e) {
            renderText(text);
          }
        } else renderText(text);
      } else {
        showError('Unsupported media type');
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      // First line: the expected SHA-256. After it: the quoted URIs, artist's first, then collectors'.
      // A URI containing quotes can only add more entries here, and each is still hash-checked.
      const [hashLine, ...rest] = document.getElementById('muri-data').textContent.split('\n');
      const hash = hashLine.trim().toLowerCase().replace(/^0x/, '');
      const uris = Array.from(rest.join('\n').matchAll(/"([^"]*)"/g), match => match[1].trim())
        .filter(uri => uri)
        .flatMap(expandUri);
      log('Expected: ' + hash + '\nURIs: ' + uris.length);

      const found = /^[0-9a-f]{64}$/.test(hash) && await fetchVerified(uris, hash);
      if (found) {
        log('Hash verified');
        render(...found);
      } else {
        contentBox.textContent = 'No media with matching hash found. All media failed hash verification.';
      }
    });
  </script>

  <!--
    Token data, filled in by the contract. It must stay the very last thing in the file: the
    parser treats everything after <plaintext> as inert text that can't be closed, so nothing in
    the hash or URIs can become markup or script. The hash is on the first line, the URIs follow.
  -->
  <plaintext hidden id="muri-data">{{FILE_HASH}}
{{FILE_URIS}}
